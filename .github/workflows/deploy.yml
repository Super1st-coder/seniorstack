name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at the same time; queue them instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    name: Deploy to VPS
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload release
        run: |
          echo "RELEASE=/opt/seniorstack-releases/${GITHUB_SHA}" >> "$GITHUB_ENV"
          git archive --format=tar.gz HEAD | ssh "$VPS_USER@$VPS_HOST" \
            "rm -rf /opt/seniorstack-releases/${GITHUB_SHA} && mkdir -p /opt/seniorstack-releases/${GITHUB_SHA} && tar -xzf - -C /opt/seniorstack-releases/${GITHUB_SHA}"

      - name: Build image & roll out
        run: ssh "$VPS_USER@$VPS_HOST" "bash $RELEASE/deploy/deploy.sh $RELEASE ${GITHUB_SHA::12}"

      - name: Smoke test
        run: |
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors \
            -o /dev/null -w 'https://seniorstack.ch -> %{http_code}\n' https://seniorstack.ch/
